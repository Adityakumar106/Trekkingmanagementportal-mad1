<!DOCTYPE html>
<html>

<head>
    <title>Staff Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3>Staff Profile</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">
                        <label>Username</label>
                        <input type="text" class="form-control" value="{{ user.username }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" value="{{ user.email }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label>Contact Number</label>
                        <input type="text" name="contact_number" class="form-control"
                            value="{{ profile.contact_number or '' }}">
                    </div>

                    <div class="mb-3">
                        <label>Address</label>
                        <textarea name="address" class="form-control" rows="3">{{ profile.address or '' }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label>Status</label><br>

                        {% if profile.approved %}
                        <span class="badge bg-success">Approved</span>
                        {% else %}
                        <span class="badge bg-warning text-dark">Pending</span>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label>Total Assigned Treks</label>
                        <input type="text" class="form-control" value="{{ total_assigned_treks }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label>Total Started Treks</label>
                        <input type="text" class="form-control" value="{{ total_started_treks }}" readonly>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Update Profile
                    </button>

                    <a href="/staff" class="btn btn-secondary">
                        Back
                    </a>

                </form>

                

            </div>

        </div>

    </div>

</body>

</html>
