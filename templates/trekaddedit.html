
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if trek %}
            Edit Trek
        {% else %}
            Add Trek
        {% endif %}
    </title>
    <link rel="stylesheet" href="../static/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
body {
        background: rgb(111, 224, 238);
}</style>    
<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>

                {% if trek %}
                    Edit Trek
                {% else %}
                    Add New Trek
                {% endif %}

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Trek Name
                        </label>

                        <input
                            type="text"
                            name="trek_name"
                            class="form-control"
                            value="{{ trek.trek_name if trek else '' }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            value="{{ trek.location if trek else '' }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Difficulty
                        </label>

                        <select
                            name="difficulty"
                            class="form-select">

                            <option value="Easy"
                                {% if trek and trek.difficulty=='Easy' %}
                                selected
                                {% endif %}>
                                Easy
                            </option>

                            <option value="Moderate"
                                {% if trek and trek.difficulty=='Moderate' %}
                                selected
                                {% endif %}>
                                Moderate
                            </option>

                            <option value="Hard"
                                {% if trek and trek.difficulty=='Hard' %}
                                selected
                                {% endif %}>
                                Hard
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Duration (Days)
                        </label>

                        <input
                            type="number"
                            name="duration_days"
                            class="form-control"
                            value="{{ trek.duration_days if trek else '' }}"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Available Slots
                        </label>

                        <input
                            type="number"
                            name="available_slots"
                            class="form-control"
                            value="{{ trek.available_slots if trek else '' }}"
                            required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4">{{ trek.description if trek else '' }}</textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Start Date
                        </label>

                        <input
                            type="date"
                            name="start_date"
                            class="form-control"
                            value="{{ trek.start_date if trek else '' }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            End Date
                        </label>

                        <input
                            type="date"
                            name="end_date"
                            class="form-control"
                            value="{{ trek.end_date if trek else '' }}"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Trek Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Pending">Pending</option>
                            <option value="Open">Open</option>
                            <option value="Closed">Closed</option>
                            <option value="Completed">Completed</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Assign Staff
                        </label>

                        <select
                            name="staff_id"
                            class="form-select">

                            <option value="">
                                Select Staff
                            </option>

                            {% for staff in staffs %}

                            <option
                                value="{{ staff.id }}"
                                {% if trek and trek.staff_id == staff.id %}
                                selected
                                {% endif %}>

                                {{ staff.user.username }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                </div>

                <div class="text-center mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        {% if trek %}
                            Update Trek
                        {% else %}
                            Create Trek
                        {% endif %}

                    </button>

                    <a href="/admindashboard"
                       class="btn btn-secondary">
                        Back
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
