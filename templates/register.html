<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../static/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<style>
    body {
        overflow: hidden;
    }

    #form {
        height: 520px;
    }
</style>

<body>
    <div id="main">
        <div id="canvas">
            <div id="form">
                <H2 style="text-decoration: underline">Register Form</H2>
                <br>
                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="name" placeholder="email" name="email">
                    </div>
                    <div class="mb-3">
                        <label for="name" class="form-label">Username</label>
                        <input type="text" class="form-control" id="name" placeholder="Username" name="username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Password"
                            name="password">
                    </div>
                    <div>
                        <h5>Are you a user or staff</h5>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"  name="role" value="user" id="flexRadioDefault1">
                            <label class="form-check-label" for="flexRadioDefault1">
                                User
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input"  name="role" value="staff" type="radio"  id="flexRadioDefault2"
                                checked>
                            <label class="form-check-label" for="flexRadioDefault2">
                                Staff
                            </label>
                        </div>

                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary" value="Login">Submit</button>
                        <br>
                        Already have an account <a href="/login">Login</a>
                    </div>


                </form>
            </div>
        </div>
    </div>
</body>

</html>
