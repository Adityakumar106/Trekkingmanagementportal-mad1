<!DOCTYPE html>
<html>
<head>
    <title>User Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background:#6fe0ee;">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>User Profile</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Username</label>

                    <input type="text"
                           class="form-control"
                           value="{{ user.username }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label>Email</label>

                    <input type="email"
                           class="form-control"
                           value="{{ user.email }}"
                           readonly>
                </div>

                <div class="mb-3">
                    <label>Phone Number</label>

                    <input type="text"
                           name="phone"
                           class="form-control"
                           value="{{ profile.phone or '' }}">
                </div>

                <div class="mb-3">
                    <label>Age</label>

                    <input type="number"
                           name="age"
                           class="form-control"
                           value="{{ profile.age or '' }}">
                </div>

                <div class="mb-3">
                    <label>Gender</label>

                    <select name="gender"
                            class="form-control">

                        <option value="">Select</option>

                        <option value="Male"
                        {% if profile.gender=="Male" %}
                        selected
                        {% endif %}
                        >
                        Male
                        </option>

                        <option value="Female"
                        {% if profile.gender=="Female" %}
                        selected
                        {% endif %}
                        >
                        Female
                        </option>

                        <option value="Other"
                        {% if profile.gender=="Other" %}
                        selected
                        {% endif %}
                        >
                        Other
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Address</label>

                    <textarea name="address"
                              class="form-control"
                              rows="3">{{ profile.address or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label>Emergency Contact</label>

                    <input type="text"
                           name="emergency_contact"
                           class="form-control"
                           value="{{ profile.emergency_contact or '' }}">
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Update Profile
                </button>

                <a href="/user"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
