<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByTrek</title>
    <link rel="stylesheet" href="/static/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<style>
    #nav {
        width: 100%;
        background-color: rgb(93, 210, 225);
    }

    
    .hero {
        margin-top: 55px;
        min-height: 55vh;
    }

    .feature-card {
        background: white;
        color: black;
        border-radius: 9px;
        padding: 20px;
        text-align: center;
        height: 100%;
    }
</style>

<body>

    <div>
        <nav id="nav" class="navbar navbar-lg navbar-light bg-blue fw-bold">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Bytrek</a>
                <div>
                <a href="/register" class="btn btn-primary" type="submit">Register</a>
                <a href="/login" class="btn btn-secondary" type="submit">Login</a>
            </div>

            </div>
        </nav>
    </div>
    
   
    <div id="main">
        <div class="hero">

            <section class="container text-center mb-5">
                <h1 class="display-5 fw-bold">Start your trekking Today</h1>
                <p class="lead mt-3 mb-4">
                    
                </p>
                <a href="/register" class="btn btn-light btn-lg mt-5 ">Get Started</a>
            </section>
        </div>

        <section class="container">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="feature-card">
                        <h5>Verified Trek staff</h5>
                        <p>Only genuine and verified person .</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="feature-card">
                        <h5>All year trek</h5>
                        <p>The trek is going on around the year</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="feature-card">
                        <h5>Enjoyment</h5>
                        <p>Many enjoyment option Prom night , Anthakshri etc</p>
                    </div>
                </div>
                

            </div>
        </section>
    </div>
</body>

</html>
